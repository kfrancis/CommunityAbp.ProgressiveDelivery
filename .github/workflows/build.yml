# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '*' ]
  release:
    types: [ published ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  NuGetDirectory: ${{ github.workspace }}/nuget

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output "${{ env.NuGetDirectory }}"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NuGetDirectory }}/*.nupkg
            ${{ env.NuGetDirectory }}/*.snupkg

  validate_packages:
    runs-on: ubuntu-latest
    needs: [ build_and_test ]
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install package validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      - name: Validate packages
        shell: pwsh
        # GitHub token only raises the rate limit for the SourceLink / repository URL checks.
        run: meziantou.validate-nuget-package (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg") --excluded-rules IconMustBeSet --github-token "${{ secrets.GITHUB_TOKEN }}"

  # Publishes via NuGet Trusted Publishing (GitHub Actions OIDC -> short-lived API key).
  # No long-lived API key is stored. The nuget.org policy is bound to this repository and
  # to this workflow file name (build.yml); renaming the file requires editing the policy.
  # NUGET_USER is a repository variable holding the nuget.org profile name that owns the policy.
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ validate_packages ]
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for NuGet/login
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          # Pushing a .nupkg also pushes the matching .snupkg from the same directory.
          $packages = Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg
          if ($packages.Count -eq 0) { Write-Error 'No packages found to push.'; exit 1 }
          foreach ($file in $packages) {
            dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
